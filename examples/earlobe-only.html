<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Earlobe tracker demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #111;
        color: #eee;
        text-align: center;
      }
      .wrap {
        position: relative;
        display: inline-block;
      }
      video {
        width: 640px;
        max-width: 100%;
        transform: scaleX(-1);
      }
      .dot {
        position: absolute;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        display: none;
        pointer-events: none;
      }
      .dot.left { background: #48f; }
      .dot.right { background: #f84; }
      #status {
        margin-top: 1rem;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <h1>Earlobe library demo</h1>
    <p>Requires <code>public/models/best.onnx</code> after training.</p>
    <div class="wrap">
      <video id="cam" playsinline muted autoplay></video>
      <div id="dot-left" class="dot left"></div>
      <div id="dot-right" class="dot right"></div>
    </div>
    <p id="status">Loading model…</p>
    <script type="module">
      import { createEarlobeTracker } from '../src/earlobe-tracker.js';

      const video = document.getElementById('cam');
      const dotL = document.getElementById('dot-left');
      const dotR = document.getElementById('dot-right');
      const status = document.getElementById('status');

      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user' },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();

      const tracker = await createEarlobeTracker({
        modelUrl: '/models/best.onnx',
        mirrorX: true,
      });
      status.textContent = 'Model ready';

      async function loop() {
        const { left, right } = await tracker.detect(video);
        const rect = video.getBoundingClientRect();
        const sx = rect.width / video.videoWidth;
        const sy = rect.height / video.videoHeight;
        function show(dot, p) {
          if (p && p.confidence > 0.5) {
            dot.style.display = 'block';
            dot.style.left = `${p.x * sx}px`;
            dot.style.top = `${p.y * sy}px`;
          } else dot.style.display = 'none';
        }
        show(dotL, left);
        show(dotR, right);
        status.textContent = [
          left ? `L ${left.x.toFixed(0)},${left.y.toFixed(0)}` : '',
          right ? `R ${right.x.toFixed(0)},${right.y.toFixed(0)}` : '',
        ]
          .filter(Boolean)
          .join(' | ') || 'No earlobe detected';
        setTimeout(loop, 33);
      }
      loop();
    </script>
  </body>
</html>
