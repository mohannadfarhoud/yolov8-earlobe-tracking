<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Earlobe tracker — MediaPipe trigger</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        background: #111;
        color: #eee;
        text-align: center;
        margin: 0;
        padding: 1rem;
      }
      .wrap {
        position: relative;
        display: inline-block;
        width: 100%;
        max-width: 480px;
      }
      video {
        width: 100%;
        transform: scaleX(-1);
        background: #000;
      }
      .dot {
        position: absolute;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        display: none;
        pointer-events: none;
      }
      .dot.left { background: #48f; }
      .dot.right { background: #f84; }
      #status {
        margin-top: 1rem;
        color: #aaa;
        font-size: 0.9rem;
        line-height: 1.4;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.0/dist/ort.min.mjs",
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm"
        }
      }
    </script>
  </head>
  <body>
    <h1>MediaPipe → Earlobe ONNX</h1>
    <p>ONNX runs only when MediaPipe detects face movement (not on a fixed timer).</p>
    <div class="wrap">
      <video id="cam" playsinline muted autoplay></video>
      <div id="dot-left" class="dot left"></div>
      <div id="dot-right" class="dot right"></div>
    </div>
    <p id="status">Loading…</p>
    <script type="module">
      import { FaceLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';
      import { createEarlobeTracker, getMobileCameraConstraints } from '../src/earlobe-tracker.js';

      const video = document.getElementById('cam');
      const dotL = document.getElementById('dot-left');
      const dotR = document.getElementById('dot-right');
      const status = document.getElementById('status');

      function show(dot, p, sx, sy) {
        if (p && p.confidence > 0.5) {
          dot.style.display = 'block';
          dot.style.left = p.x * sx + 'px';
          dot.style.top = p.y * sy + 'px';
        } else {
          dot.style.display = 'none';
        }
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia(getMobileCameraConstraints());
        video.srcObject = stream;
        await video.play();

        status.textContent = 'Loading earlobe model…';
        const tracker = await createEarlobeTracker({
          modelUrl: '/models/best.onnx',
          mirrorX: true,
          useWorker: true,
        });

        const motionCtrl = tracker.startMotionDriven(video, ({ left, right }) => {
          const rect = video.getBoundingClientRect();
          const sx = rect.width / video.videoWidth;
          const sy = rect.height / video.videoHeight;
          show(dotL, left, sx, sy);
          show(dotR, right, sx, sy);
          status.textContent =
            [left && 'L ' + left.x.toFixed(0) + ',' + left.y.toFixed(0), right && 'R ' + right.x.toFixed(0) + ',' + right.y.toFixed(0)]
              .filter(Boolean)
              .join(' | ') || 'Move head to trigger detection';
        });

        status.textContent = 'Loading MediaPipe…';
        const vision = await FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
        );
        const faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
            delegate: tracker.isMobile ? 'CPU' : 'GPU',
          },
          runningMode: 'VIDEO',
          numFaces: 1,
        });

        status.textContent = tracker.usingWorker
          ? 'Ready — ONNX in Web Worker + MediaPipe trigger'
          : 'Ready — ONNX runs on face movement';

        let lastMpTime = -1;
        function mpLoop() {
          if (video.readyState < 2) {
            requestAnimationFrame(mpLoop);
            return;
          }
          const t = performance.now();
          if (t !== lastMpTime) {
            const mp = faceLandmarker.detectForVideo(video, t);
            if (mp.faceLandmarks?.[0]) {
              motionCtrl.onLandmarks(mp.faceLandmarks[0]);
            } else {
              motionCtrl.motionTrigger.reset();
            }
            lastMpTime = t;
          }
          requestAnimationFrame(mpLoop);
        }
        mpLoop();

        window.addEventListener('pagehide', () => {
          motionCtrl.stop();
          stream.getTracks().forEach((tr) => tr.stop());
          tracker.dispose();
          faceLandmarker.close();
        });
      } catch (e) {
        status.textContent = 'Error: ' + e.message;
        console.error(e);
      }
    </script>
  </body>
</html>
